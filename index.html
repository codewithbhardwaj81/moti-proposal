<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Moti ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #00ff88;
      font-family: "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .terminal {
      width: 90%;
      max-width: 800px;
      min-height: 500px;
      background: #080808;
      border: 1px solid #00ff88;
      box-shadow: 0 0 30px #00ff8855;
      border-radius: 12px;
      padding: 25px;
    }

    .top {
      color: #888;
      margin-bottom: 25px;
    }

    .green {
      color: #00ff88;
    }

    .pink {
      color: #ff4f9a;
    }

    #terminalText {
      line-height: 1.8;
      font-size: 16px;
    }

    .proposal {
      display: none;
      text-align: center;
      margin-top: 30px;
      animation: fadeIn 1.5s ease;
    }

    .proposal h1 {
      color: #ff4f9a;
      text-shadow: 0 0 15px #ff4f9a;
    }

    .proposal p {
      color: white;
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      border: 1px solid #00ff88;
      background: transparent;
      color: #00ff88;
      padding: 12px 25px;
      margin: 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: .3s;
    }

    button:hover {
      background: #00ff88;
      color: black;
      box-shadow: 0 0 20px #00ff88;
    }

    #response {
      margin-top: 20px;
      font-size: 18px;
      color: #ff4f9a;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cursor {
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>

<body>

<div class="terminal">

  <div class="top">
    🔴 🟡 🟢 &nbsp; laukesh@heart:~$
  </div>

  <div id="terminalText"></div>
  <span class="cursor">█</span>

  <div class="proposal" id="proposal">

    <h1>❤️ ACCESS GRANTED ❤️</h1>

    <p>
      Hey <span class="pink">Moti</span>...
      <br><br>

      I've debugged my life a lot,
      <br>
      but there's one bug I don't want to fix.
      <br><br>

      Every time I think about you,
      <br>
      my heart.exe starts running. 😅
      <br><br>

      So I have one very important request...
    </p>

    <h2 style="color:white;">
      Will you go on a date with me? 🌹
    </h2>

    <button onclick="yesClicked()">YES ❤️</button>
    <button onclick="maybeClicked()">LET ME THINK 😏</button>

    <div id="response"></div>

  </div>

</div>

<script>

const lines = [
  "> Initializing Laukesh.exe...",
  "> Loading heart module...",
  "> Scanning memories...",
  "> Searching for special person...",
  "> Person found: MOTI ❤️",
  "> Running compatibility test...",
  "> Compatibility: 1000000%",
  "> Warning: Heart rate increasing...",
  "> Attempting to uninstall feelings...",
  "> ERROR 404: Feelings not found.",
  "> Conclusion: Laukesh is officially into Moti. 😶‍🌫️❤️",
  "> Executing final question..."
];

let i = 0;
let j = 0;

function typeLine() {

  if (i >= lines.length) {
    document.querySelector(".cursor").style.display = "none";
    document.getElementById("proposal").style.display = "block";
    return;
  }

  if (j < lines[i].length) {
    document.getElementById("terminalText").innerHTML += lines[i][j];
    j++;
    setTimeout(typeLine, 35);
  } else {
    document.getElementById("terminalText").innerHTML += "<br>";
    i++;
    j = 0;
    setTimeout(typeLine, 450);
  }
}

function yesClicked() {
  document.getElementById("response").innerHTML =
    "❤️ DATE_ACCEPTED = TRUE ❤️<br><br>" +
    "Congratulations Moti 😌<br>" +
    "Laukesh.exe is officially the happiest program alive.";
}

function maybeClicked() {
  document.getElementById("response").innerHTML =
    "😏 Fair enough...<br><br>" +
    "But just so you know, this developer is VERY persistent. ❤️";
}

typeLine();

</script>

</body>
</html>
